## -*- mode: perl; -*-
#
# Tau user modules on libsprt.so, aarch64 and x86_64 (target-tau/openssl.mk passes it with
# --config). The compile flags come in CFLAGS from common/configure.mk (TAU_USER); here are only
# the knobs that do not depend on them. Both targets are LP64 little-endian, pure C, pthreads of
# libsprt.so, no dynamic loading.

my %targets = (
    "tau-user-sprt-clang" => {
        inherit_from     => [ 'BASE_unix' ],
        CC               => "clang",
        CXX              => "clang++",
        cflags           => picker(default => "-Wall -Wno-incompatible-pointer-types -Wno-unused-function",
                                   debug   => "-g -O0",
                                   release => "-O3"),
        cppflags         => "",
        lib_cppflags     => "-DL_ENDIAN",
        ex_libs          => add(""),
        bn_ops           => "SIXTY_FOUR_BIT_LONG RC4_CHAR",
        thread_scheme    => "pthreads",
        dso_scheme       => "",
        perl_platform    => 'Unix',
        multilib         => "",
    },
);
