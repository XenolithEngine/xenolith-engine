## -*- mode: perl; -*-
#
# Freestanding WebAssembly (wasm32-unknown-unknown) cross-compilation target.
#
# Modeled on the xwin/mingw clang target (49-xwin-clang.conf): the heavy compile
# flags (the --target, -nostdinc/-ffreestanding, the wasm feature set, the sprt
# libc include paths and -resource-dir) are supplied by target-wasm/openssl.mk
# through the CFLAGS environment variable (= the shared SP_CFLAGS), so this config
# only carries the wasm-specific, flag-independent knobs:
#   * pure-C build - wasm has no perlasm backend, so asm_arch is intentionally
#     omitted (=> no-asm). NEON/AVX crypto paths are compiled out.
#   * ILP32 little-endian (BN_LLONG, -DL_ENDIAN), like linux-generic32.
#   * pthreads - the sprt wasm libc ships a real pthread implementation (browser
#     Workers over shared memory), so threading stays enabled; -pthread is NOT
#     added to cflags because wasm atomics/shared-memory come from the feature
#     flags in SP_CFLAGS, and pthread lives inside the sprt libc (no -lpthread).
#   * no dynamic loader (dso_scheme empty => the recipe also passes no-dso).

my %targets = (
    "wasm32-sprt-clang" => {
        inherit_from     => [ 'BASE_unix' ],
        CC               => "clang",
        CXX              => "clang++",
        cflags           => picker(default => "-Wall -Wno-incompatible-pointer-types -Wno-unused-function",
                                   debug   => "-g -O0",
                                   release => "-O3"),
        cppflags         => "",
        lib_cppflags     => "-DL_ENDIAN",
        ex_libs          => add(""),
        bn_ops           => "BN_LLONG RC4_CHAR",
        thread_scheme    => "pthreads",
        dso_scheme       => "",
        perl_platform    => 'Unix',
        multilib         => "",
    },
);
