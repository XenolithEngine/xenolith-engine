## -*- mode: perl; -*-
#
# Embox user-mode (EL0), aarch64. Freestanding cross-compilation target.
#
# Modeled on 50-wasm-sprt-clang.conf, and for the same division of labour: the
# heavy compile flags (--target, -nostdinc -ffreestanding -nostdlib, the sprt libc
# include paths, -resource-dir) arrive through the CFLAGS environment variable
# (= the shared SP_CFLAGS, filled by the EMBOX_USER branch of
# common/configure.mk), so this file carries only the knobs that do not depend on
# them:
#   * LP64 little-endian, so the bignum ops are the 64-bit ones -- this is the
#     one place the wasm profile could not be copied: it is ILP32.
#   * pure-C build. aarch64 DOES have a perlasm backend upstream, unlike wasm, so
#     no-asm here is a deliberate first-pass choice rather than a necessity:
#     the assembly wants the platform's own assembler conventions, and getting
#     the C build correct first makes the asm an isolated, measurable change
#     later. The recipe passes no-asm to match.
#   * pthreads - the sprt libc ships the layer (single-threaded until phase L3b;
#     OpenSSL uses it for once/mutex, which work). -lpthread is not added: the
#     implementation lives inside libsprt.a.
#   * no dynamic loader (dso_scheme empty => the recipe also passes no-dso),
#     because decision D5 fixes the application as one static image.

my %targets = (
    "embox-user-aarch64-sprt-clang" => {
        inherit_from     => [ 'BASE_unix' ],
        CC               => "clang",
        CXX              => "clang++",
        cflags           => picker(default => "-Wall -Wno-incompatible-pointer-types -Wno-unused-function",
                                   debug   => "-g -O0",
                                   release => "-O3"),
        cppflags         => "",
        lib_cppflags     => "-DL_ENDIAN",
        ex_libs          => add(""),
        bn_ops           => "SIXTY_FOUR_BIT_LONG RC4_CHAR",
        thread_scheme    => "pthreads",
        dso_scheme       => "",
        perl_platform    => 'Unix',
        multilib         => "",
    },
);
